<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}">
<head>{%- include head.html -%}</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <a class="logo" href="{{ '/' | relative_url }}"><span class="dot"></span>{{ site.title }}</a>
    <nav><a href="{{ '/' | relative_url }}">전체 글</a><a href="{{ '/about/' | relative_url }}">소개</a></nav>
  </div>
</header>
<main>{{ content }}</main>
<footer class="foot">
  <div class="wrap">
    <p class="foot-title">{{ site.title }}</p>
    <p>{{ site.description }}</p>
    <p class="muted">모든 글은 출처를 붙이고, 사실 확인 단계를 거쳐 올립니다. · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
  </div>
</footer>
</body>
</html>
